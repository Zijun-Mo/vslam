/**:
  ros__parameters:
    # VGGT Tracker Parameters
    model_name: "facebook/VGGT-1B"
    device: "cuda"
    window_size: 8
    image_topic: "/camera/image_raw"
    min_parallax: 0.05
    track_visibility_threshold: 0.3
    scale_enable: true
    scale_min_overlap_ratio: 0.5
    scale_jump_lower: 0.5
    scale_jump_upper: 2.0

    # ORB-SLAM3 Frontend Parameters
    voc_file: "/home/jun/vslam/src/orb_slam3_lib/orb_slam3/Vocabulary/ORBvoc.txt.bin"
    settings_file: "/home/jun/vslam/src/orb_slam3_lib/orb_slam3/config/Monocular/EuRoC.yaml"
    use_viewer: false                        # 是否开启可视化界面
    override_intrinsics_from_vggt: true     # 是否用VGGT估计的内参覆盖配置文件内参
    enable_vggt_phase2: true               # 是否启用VGGT第二阶段平面BA
    # VGGT Dense Fusion Parameters
    dense.voxel_size: 0.01                  # 稠密融合体素大小（米）
    dense.min_points_per_voxel: 1           # 体素内最少点数
    dense.max_range: 200.0                  # 稠密点云最大距离（米）
    dense.phase2_radius: 0.5                # Phase2平面邻域搜索半径（米）
    dense.phase2_max_edges: 40000           # Phase2 ICP 最大采样数（source）；refs上限为4倍

    # Video Reader Parameters
    video_path: "/docs/myroom.mp4"
    camera_name: "video_camera"
    use_sensor_data_qos: false
    camera_info_url: "package://video_reader/config/camera_info.yaml"
